name: Desktop Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            format: deb
          - os: macos-latest
            platform: macos
            format: dmg
          - os: windows-latest
            platform: windows
            format: msi

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils

      - name: Package desktop installer
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :desktop:packageDistributionForCurrentOS --no-daemon

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: saloaleh-desktop-${{ matrix.platform }}
          path: desktop/build/compose/binaries/main/${{ matrix.format }}/*
          retention-days: 7
