  commit-version-bump:
    name: Commit version bump
    runs-on: ubuntu-latest
    needs: [deploy-android]
    if: always() && (needs.deploy-android.result == 'success' || needs.deploy-ios.result == 'success')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply version bumps for succeeded jobs
        run: |
          set -euo pipefail
          VERSION_NAME="${{ github.event.inputs.version_name }}"

          {
            echo "## 🏷️ Committed version dump"
            echo ""
            echo "**Version name:** \`$VERSION_NAME\`"
            echo ""
            echo "| Platform | Field | Old | New |"
            echo "|----------|-------|-----|-----|"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.deploy-android.result }}" = "success" ]; then
            # Same code the deploy job uploaded. Do not increment the checked-out
            # Gradle file again: that file can disagree with Play and with the AAB.
            NEW_CODE="${{ needs.deploy-android.outputs.version_code }}"
            PLAY_LATEST="${{ needs.deploy-android.outputs.play_latest_version_code }}"
            GRADLE_OLD="${{ needs.deploy-android.outputs.gradle_version_code }}"
            if ! [[ "$NEW_CODE" =~ ^[0-9]+$ ]]; then
              echo "Deploy job did not provide the versionCode it uploaded (got '${NEW_CODE}')." >&2
              exit 1
            fi
            sed -i -E "s/^([[:space:]]*versionCode = )[0-9]+/\\1${NEW_CODE}/" app/build.gradle.kts
            sed -i "s/versionName = \"[^\"]*\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
            GOT=$(grep -E '^[[:space:]]*versionCode = [0-9]+' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')
            if [ "$GOT" != "$NEW_CODE" ]; then
              echo "Failed to commit versionCode ${NEW_CODE} (file has ${GOT})." >&2
              exit 1
            fi
            echo "Android versionCode: Gradle had ${GRADLE_OLD}, Play latest ${PLAY_LATEST}, committed ${NEW_CODE}"
            echo "ANDROID_VERSION_CODE=$NEW_CODE" >> "$GITHUB_ENV"
            echo "| Android | versionCode | \`${GRADLE_OLD}\` | \`${NEW_CODE}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Android | Play latest | \`${PLAY_LATEST}\` | uploaded \`${NEW_CODE}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Android | versionName | — | \`$VERSION_NAME\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Android deploy failed — skipping Android version bump"
            echo "| Android | — | _skipped (deploy failed)_ | |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.deploy-ios.result }}" = "success" ]; then
            PBXPROJ="iosApp/iosApp.xcodeproj/project.pbxproj"
            CURRENT_BUILD=$(grep 'CURRENT_PROJECT_VERSION' "$PBXPROJ" | head -1 | grep -o '[0-9]*')
            NEW_BUILD=$((CURRENT_BUILD + 1))
            sed -i "s/CURRENT_PROJECT_VERSION = $CURRENT_BUILD/CURRENT_PROJECT_VERSION = $NEW_BUILD/g" "$PBXPROJ"
            sed -i "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = $VERSION_NAME/g" "$PBXPROJ"
            echo "iOS build: $CURRENT_BUILD → $NEW_BUILD"
            echo "| iOS | CURRENT_PROJECT_VERSION | \`$CURRENT_BUILD\` | \`$NEW_BUILD\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| iOS | MARKETING_VERSION | — | \`$VERSION_NAME\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "iOS deploy failed — skipping iOS version bump"
          fi

          echo "Version name: $VERSION_NAME"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts iosApp/iosApp.xcodeproj/project.pbxproj
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: bump version to ${{ github.event.inputs.version_name }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Changelog base is the previous GitHub Release by publish time (see
      # scripts/release-notes.js). A re-run updates generated notes and leaves
      # notes that were edited by hand unchanged. Re-running a version must
      # not fail on "Release.tag_name already exists".
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.event.inputs.version_name }}
          RELEASE_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}
          RELEASE_ANDROID_RESULT: ${{ needs.deploy-android.result }}
          # iOS deploy is commented out, so the notes record it as skipped.
          # When that job is restored, also set RELEASE_IOS_RESULT to
          # needs.deploy-ios.result.
          RELEASE_TRACK: ${{ github.event.inputs.track }}
          RELEASE_TARGET: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: node scripts/release-notes.js

  schedule-build-notification:
    name: Schedule delayed build notification
    runs-on: ubuntu-latest
    needs: [deploy-android]
    if: needs.deploy-android.result == 'success' && github.event.inputs.track == 'production'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-admin
        run: npm install firebase-admin
        working-directory: scripts

      - name: Queue delayed build notification in RTDB
        run: node scripts/schedule-build-notification.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          NEW_BUILD_VERSION: ${{ github.event.inputs.version_name }}
          GOOGLE_PLAY_TRACK: production
          NOTIFY_DELAY_HOURS: '2'
