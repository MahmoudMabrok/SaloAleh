name: Deploy

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.2.0) — used for Android versionName and iOS MARKETING_VERSION'
        required: true
        default: ''
      track:
        description: 'Google Play track'
        required: true
        type: choice
        default: 'internal'
        options:
          - internal
          - alpha
          - beta
          - production
      submit_for_review:
        description: 'Submit for review (uncheck to upload only)'
        required: false
        type: boolean
        default: true

jobs:
  checks:
    name: Launch check
    uses: ./.github/workflows/build.yml
    secrets: inherit

  deploy-android:
    name: Deploy Android → Google Play
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Bump versionCode and versionName
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name }}"
          CURRENT_CODE=$(grep 'versionCode = ' app/build.gradle.kts | grep -o '[0-9]*')
          NEW_CODE=$((CURRENT_CODE + 1))
          echo "versionCode: $CURRENT_CODE → $NEW_CODE"
          echo "versionName: $VERSION_NAME"
          sed -i "s/versionCode = $CURRENT_CODE/versionCode = $NEW_CODE/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
