name: Deploy

permissions:
  contents: write
  packages: read

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.2.0) — used for Android versionName and iOS MARKETING_VERSION'
        required: true
        default: ''
      track:
        description: 'Google Play track'
        required: true
        type: choice
        default: 'internal'
        options:
          - internal
          - alpha
          - beta
          - production
      submit_for_review:
        description: 'Submit for review (uncheck to upload only)'
        required: false
        type: boolean
        default: true

jobs:

  deploy-android:
    name: Deploy Android → Google Play
    runs-on: ubuntu-latest

    outputs:
      version_code: ${{ steps.bump.outputs.version_code }}
      play_latest_version_code: ${{ steps.bump.outputs.play_latest_version_code }}
      gradle_version_code: ${{ steps.bump.outputs.gradle_version_code }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fail here, before the version bump, the release build, and the Play
      # upload. A Gradle versionCode that is behind another track is not a
      # fallback: Play is the source of truth.
      - name: Read latest versionCode from Google Play
        id: play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_PACKAGE_NAME: tools.mo3ta.salo
        run: node scripts/play-version-code.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Bump versionCode and versionName
        id: bump
        run: |
          set -euo pipefail
          VERSION_NAME="${{ github.event.inputs.version_name }}"
          NEW_CODE="${{ steps.play.outputs.next_version_code }}"
          PLAY_LATEST="${{ steps.play.outputs.latest_version_code }}"
          PLAY_TRACK="${{ steps.play.outputs.max_track_version_code }}"
          PLAY_BUNDLE="${{ steps.play.outputs.max_bundle_version_code }}"
          if ! [[ "$NEW_CODE" =~ ^[0-9]+$ ]]; then
            echo "Google Play did not yield a numeric next versionCode (got '${NEW_CODE}'). Not falling back to Gradle." >&2
            exit 1
          fi
          if ! [[ "$PLAY_LATEST" =~ ^[0-9]+$ ]]; then
            echo "Google Play did not yield a numeric latest versionCode (got '${PLAY_LATEST}'). Not falling back to Gradle." >&2
            exit 1
          fi
          if [ "$NEW_CODE" -le "$PLAY_LATEST" ]; then
            echo "Refusing versionCode ${NEW_CODE}: it is not greater than Play's latest ${PLAY_LATEST}." >&2
            exit 1
          fi
          CURRENT_CODE=$(grep -E '^[[:space:]]*versionCode = [0-9]+' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')
          if [ -z "$CURRENT_CODE" ]; then
            echo "Could not read versionCode from app/build.gradle.kts" >&2
            exit 1
          fi
          sed -i -E "s/^([[:space:]]*versionCode = )[0-9]+/\\1${NEW_CODE}/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
          GOT=$(grep -E '^[[:space:]]*versionCode = [0-9]+' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')
          if [ "$GOT" != "$NEW_CODE" ]; then
            echo "Failed to write versionCode ${NEW_CODE} (file has ${GOT})." >&2
            exit 1
          fi
          echo "Gradle versionCode: $CURRENT_CODE"
          echo "Play latest versionCode: $PLAY_LATEST (tracks: $PLAY_TRACK, bundles: $PLAY_BUNDLE)"
          echo "Uploading versionCode: $NEW_CODE"
          echo "versionName: $VERSION_NAME"
          {
            echo "version_code=${NEW_CODE}"
            echo "play_latest_version_code=${PLAY_LATEST}"
            echo "gradle_version_code=${CURRENT_CODE}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## 📦 Android version dump"
            echo ""
            echo "| Field | Old | New |"
            echo "|-------|-----|-----|"
            echo "| Gradle versionCode | \`$CURRENT_CODE\` | \`$NEW_CODE\` |"
            echo "| Play latest versionCode | \`$PLAY_LATEST\` | uploaded \`$NEW_CODE\` |"
            echo "| Play highest on a track | \`$PLAY_TRACK\` | |"
            echo "| Play highest uploaded bundle | \`$PLAY_BUNDLE\` | |"
            echo "| versionName | — | \`$VERSION_NAME\` |"
            echo ""
            echo "**Track:** \`${{ github.event.inputs.track }}\`"
            echo ""
            echo "versionCode comes from Google Play (highest code on any track or uploaded bundle, plus one), not from Gradle + 1."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json


      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release AAB
        run: ./gradlew :app:bundleRelease --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Sign AAB
        run: |
          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            app/build/outputs/bundle/release/app-release.aab \
            "${{ secrets.KEY_ALIAS }}"


      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: tools.mo3ta.salo
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: ${{ github.event.inputs.submit_for_review == 'true' && 'completed' || 'draft' }}

      # Runs only after the AAB upload succeeds, so a failed build never ships rules alone.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.30.2

      - name: Deploy database rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          firebase deploy --only database --project kamapp-3b3ac --non-interactive
          firebase deploy --only hosting --project kamapp-3b3ac --non-interactive

