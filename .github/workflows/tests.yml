name: Scripts & Rules Tests

on:
  push:
    branches: [main]
    paths:
      - 'database.rules.json'
      - 'scripts/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'database.rules.json'
      - 'scripts/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Run unit tests
        run: node --test scripts/abnormal-users.test.js scripts/rank-change.test.js scripts/challenge-medals.test.js scripts/firestore-utils.test.js

  rules-tests:
    name: Database rules tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Run rules tests against RTDB emulator
        run: firebase emulators:exec --only database --project demo-rules "node --test scripts/database-rules.test.js"
