name: Update Landing Page Stats

on:
  schedule:
    - cron: '0 6 * * *'   # 08:00 Cairo daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    name: Generate and commit stats.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-admin
        run: npm install firebase-admin
        working-directory: scripts

      - name: Generate stats.json
        run: node scripts/generate-stats.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --staged --quiet || git commit -m "chore: update landing page stats [skip ci]"
          git push
