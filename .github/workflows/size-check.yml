name: Size Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'mushaf/**'
      - 'dhikr-model/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

jobs:
  size-report:
    name: Report base vs mushaf sizes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo 'GOOGLE_SERVICES_JSON secret is missing' >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release AAB (unsigned is fine for size analysis)
        run: ./gradlew :app:bundleRelease --no-daemon
        env:
          # Signing is optional for size inspection; the deploy workflow signs separately.
          # If KEYSTORE secrets are present they will be used automatically by the build if configured.
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Decode keystore if present (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore || true

      - name: Analyze AAB module sizes
        id: analyze
        run: |
          set -euo pipefail
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          if [ -z "$AAB" ]; then
            echo 'No AAB produced' >&2
            exit 1
          fi
          echo "AAB: $AAB"
          echo "AAB size: $(du -h "$AAB" | cut -f1)"

          mkdir -p /tmp/aab-contents
          unzip -q "$AAB" -d /tmp/aab-contents

          echo '## AAB module sizes' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Module | Size |' >> "$GITHUB_STEP_SUMMARY"
          echo '|--------|------|' >> "$GITHUB_STEP_SUMMARY"

          # Top-level modules (base + dynamic features)
          for dir in /tmp/aab-contents/*/; do
            name=$(basename "$dir")
            # skip META-INF and BUNDLE-METADATA
            case "$name" in
              META-INF|BUNDLE-METADATA) continue ;;
            esac
            size=$(du -sh "$dir" | cut -f1)
            echo "- $name: $size"
            echo "| \`$name\` | $size |" >> "$GITHUB_STEP_SUMMARY"
          done

          # Also show total AAB
          aab_size=$(du -h "$AAB" | cut -f1)
          echo "| **AAB total** | **$aab_size** |" >> "$GITHUB_STEP_SUMMARY"

          # Highlight if mushaf is present and its relative size
          if [ -d /tmp/aab-contents/mushaf ]; then
            mushaf_kb=$(du -sk /tmp/aab-contents/mushaf | cut -f1)
            base_kb=$(du -sk /tmp/aab-contents/base | cut -f1)
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**mushaf** is a dynamic feature module (on-demand)." >> "$GITHUB_STEP_SUMMARY"
            echo "Base: ${base_kb} KB | mushaf: ${mushaf_kb} KB" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 3
