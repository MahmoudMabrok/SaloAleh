name: Deploy Community API

# Auto-deploys community-api/ to Deno Deploy (new platform, console.deno.com)
# on every push to main that changes community-api code (README-only edits do
# not deploy). Tests gate the deploy.
# Owner setup (already done):
#   - Secret DENO_DEPLOY_TOKEN — access token from console.deno.com
#   - Variable DENO_DEPLOY_PROJECT_COMMUNITY — the app name or its *.deno.net
#     URL, currently "saloaleh" (https://saloaleh.mahmoudmabrok.deno.net).
# The deployed app needs env vars GITHUB_TOKEN (fine-grained PAT with the
# repo's Contents read/write), GITHUB_REPO and GITHUB_BRANCH in its Deno
# Deploy settings; they persist across deploys (community-api/README.md §2).

on:
  push:
    branches: [main]
    paths:
      - 'community-api/**'
      - '!community-api/README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: deno check + test (deploy gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check
        run: deno check community-api/main.ts
      - name: Test
        run: deno test community-api/

  deploy:
    name: Deploy to Deno Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Guard — Deno Deploy setup must be complete
        env:
          DENO_DEPLOY_PROJECT_COMMUNITY: ${{ vars.DENO_DEPLOY_PROJECT_COMMUNITY }}
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DENO_DEPLOY_PROJECT_COMMUNITY" ]; then
            echo "::error::Repo variable DENO_DEPLOY_PROJECT_COMMUNITY is not set. Set it to the community-api app name or its *.deno.net URL: gh variable set DENO_DEPLOY_PROJECT_COMMUNITY -R MahmoudMabrok/SaloAleh --body \"<app-name-or-url>\""
            exit 1
          fi
          if [ -z "$DENO_DEPLOY_TOKEN" ]; then
            echo "::error::Secret DENO_DEPLOY_TOKEN is not set. Create an access token at https://console.deno.com, then: gh secret set DENO_DEPLOY_TOKEN -R MahmoudMabrok/SaloAleh"
            exit 1
          fi

      - name: Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          DENO_DEPLOY_PROJECT_COMMUNITY: ${{ vars.DENO_DEPLOY_PROJECT_COMMUNITY }}
        # Same CLI/CI mode as deno-scheduler-deploy.yml. The saloaleh app's
        # entrypoint is configured repo-relative ("community-api/main.ts" —
        # same path its git-integration builds use), so stage a minimal
        # upload tree that keeps that path instead of uploading the whole
        # repo. *_test.ts files ride along inert; the service never runs them.
        run: |
          # Accept a plain app name or the full *.deno.net URL.
          if [[ "$DENO_DEPLOY_PROJECT_COMMUNITY" == http* ]]; then
            host=$(echo "$DENO_DEPLOY_PROJECT_COMMUNITY" | sed -E 's#https?://##; s#/.*$##')
            APP=${host%%.*}
            ORG=$(echo "$host" | cut -d. -f2)
          else
            APP=$DENO_DEPLOY_PROJECT_COMMUNITY
            ORG=mahmoudmabrok
          fi
          mkdir -p "$RUNNER_TEMP/upload/community-api"
          cp -R community-api/. "$RUNNER_TEMP/upload/community-api/"
          cd "$RUNNER_TEMP/upload"
          echo "Deploying community-api to app '$APP' in org '$ORG'"
          deno deploy --json --non-interactive --org "$ORG" --app "$APP" --prod .
