name: Set Min Supported Version

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Minimum supported versionName (older builds are force-blocked to update)'
        required: true
        default: '4.2.5'

jobs:
  set-min-version:
    name: Publish minSupportedVersion to remote config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-admin
        run: npm install firebase-admin
        working-directory: scripts

      - name: Set minSupportedVersion
        run: node scripts/set-min-supported-version.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          MIN_SUPPORTED_VERSION: ${{ github.event.inputs.version }}
