name: Remove old Mushaf modules (one-time)

# Runs once on the mushaf-text branch: deletes the old :mushaf dynamic feature,
# the :mushaf-assets pack (~9k page images) and the #233 files, which are too many
# to delete through the API. The workflow file itself is deleted right after.
on:
  push:
    branches: [feat/mushaf-text-library]

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mushaf-text-library
      - name: Delete old Mushaf files
        run: |
          set -e
          paths="mushaf mushaf-assets app/src/androidMain/kotlin/tools/mo3ta/salo/ui/quran/MushafStorage.android.kt app/src/commonMain/composeResources/values/mushaf_storage.xml app/src/commonMain/composeResources/values-en/mushaf_storage.xml app/src/commonMain/composeResources/values-ur/mushaf_storage.xml app/src/commonMain/composeResources/values-zh/mushaf_storage.xml"
          existing=""
          for p in $paths; do [ -e "$p" ] && existing="$existing $p"; done
          if [ -z "$existing" ]; then echo "Nothing to delete"; exit 0; fi
          git rm -r -q $existing
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Remove the old Mushaf dynamic feature, asset pack and #233 storage files"
          git push origin HEAD:feat/mushaf-text-library
