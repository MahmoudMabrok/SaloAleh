name: GA4 Analytics Report

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days back (e.g. 7, 28). Ignored if start_date/end_date are set.'
        required: false
        default: ''
      start_date:
        description: 'Date range start YYYY-MM-DD (use with end_date for a custom range)'
        required: false
        default: ''
      end_date:
        description: 'Date range end YYYY-MM-DD (use with start_date for a custom range)'
        required: false
        default: ''

jobs:
  ga4-report:
    name: Run GA4 analytics report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-auth google-auth-httplib2 requests

      - name: Write SA key
        run: echo "$FIREBASE_SA_JSON" > /tmp/sa-key.json
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Run GA4 report
        run: |
          if [ -n "$INPUT_START" ] && [ -n "$INPUT_END" ]; then
            ARGS="--start $INPUT_START --end $INPUT_END"
          elif [ -n "$INPUT_DAYS" ]; then
            ARGS="${INPUT_DAYS}d"
          else
            ARGS=""
          fi
          python3 scripts/ga4-report.py $ARGS
        env:
          SALO_SA_KEY: /tmp/sa-key.json
          GA4_PROPERTY: ${{ secrets.GA4_PROPERTY_ID }}
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_START: ${{ inputs.start_date }}
          INPUT_END: ${{ inputs.end_date }}

      - name: Cleanup
        if: always()
        run: rm -f /tmp/sa-key.json
