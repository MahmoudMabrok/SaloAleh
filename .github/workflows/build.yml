name: Build

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:
  workflow_call:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    # Skip the Android build when the PR is on hold (labeled "hold").
    # workflow_dispatch runs have no pull_request payload, so the job still runs there.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'hold') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  launch:
    name: App opens
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'hold') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build the base app and the launch test
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: Open the app without the Mushaf module
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r -t app/build/outputs/apk/debug/app-debug.apk
            adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            set +e
            adb shell am instrument -w -r \
              -e class tools.mo3ta.salo.LaunchSmokeTest \
              tools.mo3ta.salo.test/androidx.test.runner.AndroidJUnitRunner
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then
              echo "----- launch crashed -----"
              adb logcat -d -t 400
              exit "$code"
            fi

