name: Aggregate All-Time Total

on:
  # Runs once per week on Fridays at 17:00 UTC (19:00 Cairo).
  schedule:
    - cron: '0 17 * * 5'
  workflow_dispatch:
    inputs:
      closed_round:
        description: 'Round key to aggregate (YYYY-MM-DD). Defaults to today Cairo date.'
        required: false
        type: string

jobs:
  aggregate:
    name: Sum past rounds into allTimeTotal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-admin
        run: npm install firebase-admin
        working-directory: scripts

      - name: Aggregate all-time total
        run: node scripts/aggregate-all-time.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          CLOSED_ROUND: ${{ inputs.closed_round }}
