name: Write Round Results

# Read-only on Firebase and on the repo: rebuilds the public results of an already-closed
# round (scripts/write-round-results.js only reads RTDB) and writes them to the job
# summary (Arabic table + JSON) and to the step log between
# === ROUND_RESULTS_JSON_BEGIN === / === ROUND_RESULTS_JSON_END === markers.
# Nothing is committed. Safe to re-run — unlike aggregate-all-time.yml it never touches
# allTimeTotal, medals, achievements, winner codes or the leaderboard.
on:
  workflow_dispatch:
    inputs:
      closed_round:
        description: 'Round key to write results for (YYYY-MM-DD). Defaults to today Cairo date.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  write:
    name: Write round-results summary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-admin
        run: npm install firebase-admin
        working-directory: scripts

      - name: Write round results (read-only on Firebase)
        run: node scripts/write-round-results.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          CLOSED_ROUND: ${{ inputs.closed_round }}
