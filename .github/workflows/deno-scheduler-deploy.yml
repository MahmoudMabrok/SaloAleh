name: Deploy Deno Scheduler

# Auto-deploys deno-scheduler/main.ts to Deno Deploy (Classic) on every push
# to main that touches the scheduler. Tests gate the deploy. One-time owner
# setup (fail-fast messages below repeat these):
#   1. Secret DENO_DEPLOY_TOKEN   — access token from
#      https://dash.deno.com/account#access-tokens
#      (gh secret set DENO_DEPLOY_TOKEN -R MahmoudMabrok/SaloAleh)
#   2. Variable DENO_DEPLOY_PROJECT — the Deno Deploy project name; the
#      project must already exist on dash.deno.com (deployctl does not create
#      projects).
#      (gh variable set DENO_DEPLOY_PROJECT -R MahmoudMabrok/SaloAleh --body "<name>")

on:
  push:
    branches: [main]
    paths:
      - 'deno-scheduler/**'
      - '.github/workflows/deno-scheduler-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: deno check + test (deploy gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check
        run: deno check deno-scheduler/main.ts deno-scheduler/schedule_test.ts
      - name: Test
        run: deno test deno-scheduler/schedule_test.ts

  deploy:
    name: Deploy to Deno Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — Deno Deploy setup must be complete
        env:
          DENO_DEPLOY_PROJECT: ${{ vars.DENO_DEPLOY_PROJECT }}
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DENO_DEPLOY_PROJECT" ]; then
            echo "::error::Repo variable DENO_DEPLOY_PROJECT is not set. Set it to the Deno Deploy project name (the project must exist on dash.deno.com): gh variable set DENO_DEPLOY_PROJECT -R MahmoudMabrok/SaloAleh --body \"<project-name>\""
            exit 1
          fi
          if [ -z "$DENO_DEPLOY_TOKEN" ]; then
            echo "::error::Secret DENO_DEPLOY_TOKEN is not set. Create an access token at https://dash.deno.com/account#access-tokens, then: gh secret set DENO_DEPLOY_TOKEN -R MahmoudMabrok/SaloAleh"
            exit 1
          fi

      - name: Deploy to Deno Deploy
        uses: denoland/deployctl@v1
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        with:
          project: ${{ vars.DENO_DEPLOY_PROJECT }}
          root: deno-scheduler
          entrypoint: main.ts
          # main.ts is self-contained (see its header). Add any new file it
          # imports here, e.g. "main.ts,deno.json".
          include: main.ts
