<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>SaloAleh</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="hdr">
      <div class="hdr-row">
        <span class="badge" id="country">—</span>
        <span class="round" id="round">—</span>
      </div>
      <div id="bonus" class="bonus hidden">يوم الجمعة — مضاعفة الأجر ﷺ</div>
    </header>

    <main class="main">
      <div class="count" id="count">0</div>
      <div class="hint">صلِّ على النبي ﷺ</div>
      <button class="tap" id="tap" type="button">+1 صلاة</button>
    </main>

    <footer class="ftr">
      <button class="link" id="open-window" type="button">نافذة عائمة</button>
      <button class="link" id="open-settings" type="button">الإعدادات و QR</button>
    </footer>

    <script src="lib/round.js"></script>
    <script src="lib/country.js"></script>
    <script src="lib/state.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
