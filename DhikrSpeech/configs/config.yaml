# DhikrSpeech - single source of configuration.
#
# Every notebook and every module reads this file. Nothing is hard-coded
# elsewhere; if a value matters it lives here.

# Global random seed. Used for splits, shuffling, augmentation and TF/Keras.
seed: 1337

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
# All directories below are relative to `drive_root/project_dir` unless they
# are given as absolute paths, in which case they are used verbatim.
paths:
  drive_root: /content/drive/MyDrive
  project_dir: "Dhikr Speech Dataset"

  dataset_dir: dataset          # raw recordings, one folder per class id
  processed_dir: processed      # 16 kHz mono PCM16 output of notebook 02
  noise_dir: noise              # optional background-noise wavs for augmentation
  checkpoints_dir: checkpoints
  exports_dir: exports
  logs_dir: logs                # TensorBoard + CSV training logs
  reports_dir: reports          # validation reports, metrics, charts
  # Long-form recordings for streaming evaluation:
  #   streaming/audio/*.wav + streaming/annotations.json
  # (`audio/` is optional - the recordings may sit next to annotations.json.)
  # If this folder does not exist, the usual other names are tried and the
  # fallback is logged, so renaming it does not silently lose the set.
  streaming_dir: streaming

  phrases_file: phrases.json    # [{"id": 1, "text": "..."}, ...]
  unknown_class: unknown        # folder holding out-of-vocabulary / filler audio
  # Optional CSV mapping recordings to speakers: file,speaker (see README).
  # Explicit metadata beats guessing an id out of the filename.
  speakers_file: speakers.csv

# ---------------------------------------------------------------------------
# Classes - which phrases the model learns to tell apart
# ---------------------------------------------------------------------------
# Ten classes need a lot of recordings. Training on a subset is the cheapest way
# to get a working model out of a small dataset: the same clips give more per
# class, and chance accuracy rises from 1/10 to 1/4, so the numbers start meaning
# something much sooner. Add the rest back as the dataset grows.
#
# The selection decides the class vocabulary, the class indices frozen into the
# manifest, the width of the model's output and labels.txt. After changing it,
# re-run 02_preprocessing and train under a fresh run (FRESH_START / RUN_NAME) -
# an old checkpoint has the wrong number of outputs.
classes:
  # Phrase ids from phrases.json. null (or []) trains on every folder found.
  # [1, 2, 3, 4] = the four short, distinct phrases:
  #   1 سبحان الله | 2 الحمد لله | 3 الله أكبر | 4 لا إله إلا الله
  include_phrases: []
  # Keep the `unknown` filler folder when one exists. It is not a phrase id, so
  # the selection above never covers it.
  include_unknown: true

  # Negatives may be organised into subfolders under `unknown/`:
  #
  #   dataset/unknown/normal_speech/*.wav
  #   dataset/unknown/hard_negative/*.wav      <- the ones that decide the model
  #   dataset/unknown/partial_phrase/*.wav
  #   dataset/unknown/other_dhikr/*.wav
  #   dataset/unknown/noise/*.wav
  #
  # Everything below `unknown/` trains as the single `unknown` output class. The
  # subfolder is kept in the manifest as `negative_type`, so evaluation can report
  # false positives per category and say *what kind* of audio breaks the detector.
  # A flat `unknown/*.wav` folder still works and is reported as `unknown`.
  negative_types: [normal_speech, hard_negative, partial_phrase, other_dhikr, noise, unknown]
  # true would give each category its own output class. That needs far more data
  # per category than a first dataset has - leave it off unless you have it.
  split_negative_classes: false

# ---------------------------------------------------------------------------
# Target - the production architecture: one model per dhikr
# ---------------------------------------------------------------------------
# Android does not classify. The user picks one dhikr before a listening session
# and the app loads that dhikr's own model, whose only job is:
#
#     TARGET    the selected phrase, spoken completely
#     UNKNOWN   anything else - other dhikr, incomplete versions of this one,
#               ordinary speech, Quran, TV, noise, silence
#
# So training is binary phrase spotting, one independent model per phrase, and a
# false count is far more damaging than an occasional miss.
#
# `phrase_id: all` builds one independent model for every numeric dataset folder
# also listed in phrases.json (or the subset in classes.include_phrases). Catalog
# entries with no collected folder are reported and skipped. The CLI binds each
# id separately, so manifests, checkpoints, calibration and exports never mix.
# `phrase_id: null` is only the legacy multi-class comparison mode.
target:
  phrase_id: all
  # sigmoid = one output P(target), matching the production question. Legacy
  # two-output softmax remains supported for old experiments/checkpoints.
  output_mode: sigmoid
  # Every other phrase folder (dataset/001, dataset/006, ...) becomes a negative.
  # These are the hard negatives that cost nothing - they are already collected.
  auto_other_dhikr_negatives: true
  # Negatives live under dataset/unknown/<category>/. Untagged files are shared;
  # a filename ending `_hard_negative_006` is used only as a hard negative for
  # target 006. See docs/DATA_COLLECTION.md.
  # Per-target window length. A two-word dhikr and a seven-word one do not belong
  # in the same window; the dataset report prints a recommendation from the
  # measured utterance durations, and applying it stays a human decision because
  # it invalidates every cached clip and checkpoint.
  phrase_overrides: {}
  #  "007":
  #    clip_seconds: 2.5

# ---------------------------------------------------------------------------
# Negative sampling
# ---------------------------------------------------------------------------
# The shared negative pool grows without bound while positives stay in the
# hundreds, so training on all of it every run drowns the phrase. `ratio` caps
# negatives at ratio x positives; `weights` decides which negatives survive that
# cut. Sampling is without replacement and deterministic in `seed`, and the run
# logs how many clips were dropped - a silent cut would read as full coverage.
negative_sampling:
  enabled: true
  ratio: 2.0
  weights:
    hard_negative: 4.0      # near-misses of this target - worth the most per clip
    partial_phrase: 3.0     # incomplete utterances
    other_dhikr: 2.0
    general_speech: 1.0
    background_audio: 1.0
    unknown: 1.0
    noise: 0.5
    silence: 0.5

# ---------------------------------------------------------------------------
# Audio
# ---------------------------------------------------------------------------
audio:
  sample_rate: 16000
  channels: 1                   # 1 = mono. The pipeline only supports mono.
  bit_depth: 16                 # PCM16 output
  clip_seconds: 2.0             # fixed model input length (pad / crop to this)
  file_extensions: [".wav", ".WAV", ".flac", ".ogg", ".m4a", ".mp3", ".webm"]

  # Recordings outside this range are reported by the validator.
  min_duration: 0.30
  max_duration: 8.00

  # A clip whose RMS is below this is treated as empty/silent.
  silence_dbfs: -55.0

  trim:
    enabled: true
    top_db: 30.0                # librosa.effects.trim threshold
    pad_ms: 50.0                # keep this much audio around the kept region

  normalize:
    enabled: true
    target_dbfs: -20.0          # RMS target
    peak_ceiling: 0.99          # hard limit after gain, prevents clipping

  # How a clip shorter/longer than clip_seconds is fitted to clip_seconds.
  # center = pad or crop symmetrically, end = pad or crop at the end.
  fit_mode: center

# ---------------------------------------------------------------------------
# Features - log mel spectrogram
# ---------------------------------------------------------------------------
features:
  n_mels: 40
  window_ms: 30.0
  hop_ms: 10.0
  n_fft: 512
  fmin: 20.0
  fmax: 7600.0
  log_offset: 1.0e-6            # log(mel + offset), keeps the log finite
  center: false                 # false => frame count is deterministic, matches Android
  # none | per_example (zero mean / unit variance per clip) | global (dataset stats)
  normalize: per_example

# ---------------------------------------------------------------------------
# Augmentation - training split only, applied on the fly
# ---------------------------------------------------------------------------
augmentation:
  enabled: true

  background_noise:
    enabled: true
    probability: 0.5
    min_snr_db: 5.0
    max_snr_db: 25.0
    # Used when noise_dir is empty or missing.
    synthetic_when_missing: true

  pitch_shift:
    enabled: true
    probability: 0.3
    min_semitones: -2.0
    max_semitones: 2.0

  speed_perturb:
    enabled: true
    probability: 0.3
    min_rate: 0.90
    max_rate: 1.10

  gain:
    enabled: true
    probability: 0.5
    min_db: -6.0
    max_db: 6.0

  time_shift:
    enabled: true
    probability: 0.5
    max_shift_ms: 150.0

  # Mild synthetic room reverberation (generated impulse response - no extra
  # dependency, no impulse-response corpus). A phone at arm's length in a tiled
  # room sounds nothing like a close-mic recording, and this is the part of that
  # gap augmentation can imitate honestly. Keep the decay short: a long tail
  # smears the consonants that separate 006 from 007.
  reverb:
    enabled: false
    probability: 0.25
    min_decay_ms: 80.0
    max_decay_ms: 300.0
    min_wet: 0.10               # wet/dry mix; above ~0.5 it stops sounding like a phone
    max_wet: 0.35

  spec_augment:
    enabled: true
    probability: 0.5
    freq_masks: 1
    freq_mask_width: 6          # mel bins
    time_masks: 2
    time_mask_width: 12         # frames

# ---------------------------------------------------------------------------
# Dataset splitting
# ---------------------------------------------------------------------------
split:
  val_ratio: 0.15
  test_ratio: 0.10              # 0.0 disables the test split
  stratified: true
  # Legacy: a bare regex matched against the file name. Still honoured (read as
  # speaker.regex with speaker.source: filename), kept so old configs run
  # unchanged. New configs should use the speaker section below.
  group_regex: null

  # Speaker-safe splitting. The same voice must never appear in two splits: if it
  # does, the test accuracy answers "can the model recognise this speaker again",
  # not "does it work for a new user" - and that is the only question that matters
  # for an app installed by strangers.
  speaker:
    # auto     - speakers.csv if present, else the regex if it matches most files,
    #            else a per-speaker subfolder, else none (with a loud warning)
    # metadata - speakers.csv only
    # filename - regex against the file name
    # parent   - the recording's folder inside the class folder (dataset/006/ali/*.wav)
    # none     - no speaker information; evaluation is NOT speaker-independent
    source: auto
    # A single pattern that overrides the list below. null = use the list.
    regex: null
    # Tried in order; the first token that is not the class folder's own name
    # wins. The collector's device token comes first deliberately: its uploads are
    # named <class>_sp<8 hex>_<timestamp>_<suffix>, so a pattern that simply took
    # the leading token would extract the CLASS ID and make every recording of a
    # phrase one "speaker" - putting whole classes in one split with nothing
    # looking wrong. A named (?P<speaker>...) group wins, else group 1, else the
    # whole match.
    filename_patterns:
      - '(?P<speaker>sp[0-9a-f]{8})'        # SpeechCollector device token
      - '^(?P<speaker>[A-Za-z0-9\-]+?)[_\-]' # hand-named: ali_001.wav
    metadata_file: null         # null = paths.speakers_file
    # When speakers are known, a speaker in two splits fails preprocessing rather
    # than warning. A silent leak invalidates every number downstream.
    require_disjoint: true
    min_speakers: 10            # below this the split is safe but not diverse
    # Coverage below which `auto` warns that most files have no speaker id. It
    # never rejects the source: grouping the files that do carry one is strictly
    # better than splitting all of them at random.
    auto_match_ratio: 0.6

# ---------------------------------------------------------------------------
# Dataset quality - recommendations, never blocking
# ---------------------------------------------------------------------------
# The pipeline runs on a prototype dataset (tens of clips) on purpose, so the
# plumbing can be verified before the recordings exist. These numbers are what
# the dataset report measures against so a prototype is never mistaken for a
# production dataset.
quality:
  prototype_recordings_per_class: 100
  prototype_speakers: 10
  recommended_recordings_per_class: 200   # first model worth shipping: 200-500
  recommended_speakers: 20
  min_unknown_ratio: 0.5        # unknown clips as a share of target clips
  max_class_imbalance: 3.0      # largest class / smallest class
  min_negative_category: 20     # clips before a category's FP rate is a number

# ---------------------------------------------------------------------------
# Model - DS-CNN (depthwise separable CNN, the standard KWS topology)
# ---------------------------------------------------------------------------
model:
  # ds_cnn | ds_cnn_tiny | tc_resnet8. The values below are the shared baseline;
  # `model_presets` under this block overrides only what makes each architecture
  # what it is, so an architecture comparison changes the architecture and
  # nothing else.
  name: ds_cnn
  stem_filters: 64
  stem_kernel: [10, 4]          # (time, freq)
  stem_stride: [2, 2]
  blocks: 4
  block_filters: 64
  block_kernel: [3, 3]
  # Capacity should track the dataset. At a few hundred clips this network has more
  # parameters than it has recordings to fit, and it will drive training accuracy to
  # 1.0 while validation plateaus. 0.5 quarters the parameter count and is the first
  # knob to reach for once the run reports an overfitting gap; raise it back toward
  # 1.0 as the dataset grows into the thousands of clips.
  width_multiplier: 1.0
  # 0.3 rather than the usual 0.2: with a small, single-session dataset the network
  # can memorise a clip from a handful of frames, and the extra dropout costs almost
  # nothing here. Lower it again when train and val accuracy move together.
  dropout: 0.3
  use_bias: false
  activation: relu
  pool: gap                     # gap | flatten
  # BatchNorm moving-average momentum. Keras defaults to 0.99, which needs
  # thousands of steps to converge; a few hundred clips give only a handful of
  # steps per epoch, leaving the moving statistics near their init and collapsing
  # the model at inference time while training accuracy still looks fine.
  # 0.9 converges in ~50 steps. Raise it toward 0.99 only for large datasets.
  bn_momentum: 0.9
  # TC-ResNet8 only: [stem, block1, block2, block3] channels, and the time-axis
  # kernels. The mel axis becomes the channel axis, so these convolve over time
  # alone - which is what makes it a fraction of the multiply-accumulates.
  tc_channels: [16, 24, 32, 48]
  tc_kernel: 9
  tc_stem_kernel: 3

# Architecture presets, applied on top of `model` by Config.resolved_model().
# Single-target detection is a far easier problem than 10-way classification, so
# a much smaller network is worth measuring before assuming the big one is
# needed - and the smallest model that meets the release criteria is the one to
# ship, not the most accurate one.
model_presets:
  ds_cnn: {}
  ds_cnn_tiny:
    stem_filters: 32
    block_filters: 32
    blocks: 3
    width_multiplier: 0.5
  tc_resnet8:
    dropout: 0.2

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
training:
  # What matters for convergence is the number of *optimiser steps*, not epochs:
  # steps = ceil(train_clips / batch_size) x epochs. 80 recordings at batch 64 is
  # 2 steps per epoch, so a 60-epoch run is 120 gradient steps in total - a DS-CNN
  # trained from scratch is barely off its initialisation there, which reads as
  # "stuck at chance" even when the loss is in fact falling. Small batch + many
  # epochs buys the steps back. Raise the batch again (64 - 128) and drop the
  # epochs once the dataset is in the thousands of clips.
  epochs: 300
  batch_size: 16
  shuffle_buffer: 4096
  mixed_precision: true         # honoured only when a GPU is present
  class_weights: true
  label_smoothing: 0.1

  # adamw, not adam: `weight_decay` below is only honoured by adamw and sgd, so
  # under plain adam the decay is configured and silently ignored. On a dataset this
  # small that is a regulariser given away for free.
  optimizer: adamw              # adam | adamw | sgd | rmsprop
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4          # adamw / sgd only - ignored under adam / rmsprop
  momentum: 0.9                 # sgd only
  gradient_clip_norm: 1.0       # null disables clipping

  # cosine | exponential | plateau | none
  lr_schedule: cosine
  # Warmup is counted in epochs and converted to steps, so a tiny dataset needs
  # more epochs of it to get the same number of warmup steps.
  warmup_epochs: 5
  min_learning_rate: 1.0e-5
  plateau_factor: 0.5
  plateau_patience: 4

  # Legacy multi-class experiments also track macro F1. Sigmoid detectors track
  # TARGET precision, recall, epoch-level F1, ROC AUC and PR AUC.
  macro_f1: true

  early_stopping:
    enabled: true
    monitor: val_pr_auc
    mode: max
    # Patience is in epochs; with a small dataset an epoch is a handful of steps,
    # so a patience tuned for big-dataset epochs stops the run before it starts.
    patience: 40
    min_delta: 0.001
    restore_best_weights: true

  checkpoint:
    monitor: val_pr_auc
    mode: max
    save_best_only: true
    save_freq: epoch

  tensorboard:
    enabled: true
    histogram_freq: 0
    update_freq: epoch

  resume: false                 # opt in only when config snapshot is exactly compatible
  cache: true                   # cache decoded audio of the training split in RAM
  prefetch: true

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  batch_size: 128
  split: test                   # test | val
  roc: true                     # one-vs-rest ROC + macro AUC
  top_k_confusions: 15
  error_examples: 12            # false positives / negatives listed per class
  confidence_threshold: 0.5     # a prediction below this counts as "no keyword"

# ---------------------------------------------------------------------------
# Streaming - continuous microphone inference and event counting
# ---------------------------------------------------------------------------
# This is what actually ships. A phrase passes through many overlapping windows,
# so counting windows above a threshold counts one dhikr four or five times; a
# plain refractory timer is no better, because any timer long enough to swallow a
# 2 s phrase also swallows the next repetition.
streaming:
  window_seconds: null          # null = audio.clip_seconds (what the model saw)
  hop_seconds: 0.20             # 200-250 ms is the usual range
  # Where the recordings live is `paths.streaming_dir` - one setting, because two
  # knobs for one path is how a project ends up being told its data is missing at
  # a folder it is looking straight at. If that folder does not exist, the usual
  # other names (`streaming/`, `streaming_tests/`) are tried and the fallback is
  # logged.
  annotations_file: annotations.json
  audio_dirname: audio
  # A detection counts for an annotated repetition when it lands inside
  # [start - tolerance, end + tolerance].
  match_tolerance_seconds: 0.75

  # Optional smoothing of the score timeline. Deliberately off: smoothing wide
  # enough to bridge the dip between two repetitions merges them into one count.
  smoothing:
    mode: none                  # none | ema | moving_average
    ema_alpha: 0.6              # weight of the newest window (1.0 = no smoothing)
    window: 3                   # moving_average only, in windows

  # The event state machine. activation > release is what stops a score hovering
  # near one threshold from producing a stream of counts, and re-arming is driven
  # by the release so that rapid repetitions stay separate. Keep cooldown_ms
  # short - it is a safety net, not the separator.
  #
  # These are starting values. The ones that ship come from the calibration
  # sweep below and are written into each target's model_metadata.json.
  detector:
    activation_threshold: 0.70
    release_threshold: 0.40
    min_consecutive_hits: 2
    min_event_seconds: 0.0
    release_windows: 2
    cooldown_ms: 200.0

# ---------------------------------------------------------------------------
# Threshold calibration
# ---------------------------------------------------------------------------
# 0.5 is a default, not a threshold. The activation threshold that ships is the
# lowest one whose measured false activations per hour stay inside the budget -
# lower thresholds detect more, so the lowest admissible one is also the
# highest-recall admissible one. When nothing qualifies, calibration reports a
# FAILURE rather than reaching for 0.99 and calling it tuned: at that point the
# negatives are the problem, not the threshold.
calibration:
  enabled: true
  min_threshold: 0.40
  max_threshold: 0.99
  step: 0.01
  target_false_activations_per_hour: 0.5
  min_event_recall: 0.0         # optional second constraint
  # release_threshold = activation x release_ratio unless one is pinned below.
  # Scaling it keeps the hysteresis gap meaningful at high activation values.
  release_ratio: 0.6
  release_threshold: null

# ---------------------------------------------------------------------------
# Release criteria
# ---------------------------------------------------------------------------
# Project policy, not scientific constants - they live here so that moving one
# is a visible decision. A target can never reach "READY FOR DEVICE TEST" on
# clip accuracy alone: an unmeasured criterion counts as unmeasured, which caps
# the status at EXPERIMENTAL.
readiness:
  max_speaker_leakage: 0
  min_positive_speakers: 10
  min_positive_clips: 100
  recommended_positive_clips: 200     # 200-500 is a real-world starting point
  recommended_positive_speakers: 20
  min_event_precision: 0.95
  min_event_recall: 0.90
  max_false_activations_per_hour: 0.5
  max_hard_negative_fp_rate: 0.05
  max_duplicate_rate: 0.05
  # INT8 is rejected as the production variant when quantisation costs more than
  # this many extra false activations per hour, or drifts further than this.
  max_int8_fa_per_hour_increase: 0.10
  max_int8_probability_drift: 0.05

# ---------------------------------------------------------------------------
# Export
# ---------------------------------------------------------------------------
export:
  saved_model: true
  float32: true
  dynamic_range: true
  int8: true
  representative_samples: 300   # clips drawn from the training split for INT8
  benchmark_runs: 100
  benchmark_warmup: 10
  # Desktop -> phone scaling used to report an expected on-device latency.
  # It is a documented estimate, not a measurement. Calibrate per device.
  android_latency_factor: 3.0
  verify_tolerance: 0.05        # max |float32 - quantized| probability drift
