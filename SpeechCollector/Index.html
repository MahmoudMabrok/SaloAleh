<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#176b45">
  <style>
/*__STYLES__*/
  </style>
</head>
<body>
  <main class="page-shell">
    <section class="collector-card" aria-labelledby="hero-title">
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">☪</div>
        <h1 id="hero-title" data-i18n="hero"></h1>
      </header>

      <div class="summary">
        <p class="summary-line">
          <span id="summary-phrases"></span>
          <span id="summary-samples"></span>
        </p>
        <div class="progress-track" aria-hidden="true">
          <span id="progress-fill"></span>
        </div>
      </div>

      <p class="list-hint" data-i18n="listHint"></p>
      <p class="microphone-hint" data-i18n="microphoneHint"></p>

      <div id="page-status" class="status status-info" role="status" aria-live="polite"></div>

      <div id="standalone-banner" class="standalone-banner" hidden>
        <a id="standalone-link" class="button button-primary button-wide" target="_blank" rel="noopener">
          <span aria-hidden="true">🎙</span><span data-i18n="openStandalone"></span>
        </a>
      </div>

      <ul id="phrase-list" class="phrase-list"></ul>

      <p class="privacy-note"><span aria-hidden="true">🔒</span> <span data-i18n="privacy"></span></p>
    </section>
  </main>

  <div id="upload-all-bar" class="upload-all-bar" hidden>
    <button id="upload-all-button" class="button button-primary button-wide" type="button">
      <span aria-hidden="true">⬆</span><span id="upload-all-label"></span>
    </button>
  </div>

  <audio id="audio-player" preload="metadata"></audio>
  <script id="bootstrap-data" type="application/json"><?!= bootstrapJson ?></script>
  <script>
/*__APP_JS__*/
  </script>
</body>
</html>
